name: Migrate dependencies and verify

on:
  push:
    branches:
      - chore/next16-security-dependencies-20261117
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile and apply security fixes
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit fix --package-lock-only --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate lockfile and security fixes"
            git push origin HEAD:chore/next16-security-dependencies-20261117
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=low
